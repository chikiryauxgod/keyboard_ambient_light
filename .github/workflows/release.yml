name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0); existing tags build their exact commit'
        type: string
        required: true
      draft:
        description: 'Keep release as a draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and resolve immutable source commit
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_metadata.py --tag "$RELEASE_TAG" --fallback "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
  build:
    needs: metadata
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      release_tag: ${{ needs.metadata.outputs.tag }}
  publish:
    name: Publish verified desktop artifacts
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete artifact set and checksums
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/verify_assets.py release-assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Create tag and publish release only after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          KEEP_DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          # Fetch again to detect a tag changed while the builds were running.
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            actual=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            test "$actual" = "$SOURCE_COMMIT" || { echo "Tag no longer matches built commit" >&2; exit 1; }
          else
            git tag -- "$RELEASE_TAG" "$SOURCE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          shopt -s nullglob
          archives=(release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS)
          gh release create "$RELEASE_TAG" "${archives[@]}" "${args[@]}"
          if [ "$KEEP_DRAFT" != true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
